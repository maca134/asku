# Relay behind a Cloudflare Tunnel. No published ports: only cloudflared can reach the relay,
# so cf-connecting-ip can't be forged. Needs TUNNEL_TOKEN in .env next to this file.
services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      ASKU_IP_HEADER: cf-connecting-ip
    volumes:
      - data:/data
    labels:
      com.centurylinklabs.watchtower.enable: "false" # built locally; redeploy by rebuilding

  tunnel:
    image: cloudflare/cloudflared:2026.10.3
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - relay

volumes:
  data:
