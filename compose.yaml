# Relay behind a Cloudflare Tunnel. No published ports: only cloudflared can reach the relay,
# so cf-connecting-ip can't be forged. Needs TUNNEL_TOKEN in .env next to this file.
# Deploys: publishing a GitHub Release pushes ghcr.io/maca134/asku:latest (.github/workflows/release.yml);
# the host's own Watchtower (label-enable, logged in to ghcr.io) pulls it and restarts the relay.
# `docker compose up -d --build` still builds locally.
services:
  relay:
    image: ghcr.io/maca134/asku:latest
    build: .
    restart: unless-stopped
    environment:
      ASKU_IP_HEADER: cf-connecting-ip
    volumes:
      - data:/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  tunnel:
    image: cloudflare/cloudflared:2026.10.3
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - relay

volumes:
  data:
